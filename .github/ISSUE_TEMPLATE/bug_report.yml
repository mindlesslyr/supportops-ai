name: Bug report
description: Report a reproducible defect in SupportOps AI
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a problem. Remove secrets and customer data from all examples.
  - type: textarea
    id: description
    attributes:
      label: Bug description
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Send ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or responses
      description: Redact API keys, signatures, tokens, email addresses, and customer content.
      render: shell
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: git rev-parse --short HEAD
    validations:
      required: true
  - type: dropdown
    id: runtime
    attributes:
      label: Runtime
      options:
        - Local Python
        - Docker Compose
        - Other
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for duplicates.
          required: true
        - label: I removed secrets and customer data from this report.
          required: true
